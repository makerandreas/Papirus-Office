name: Papirus Office CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *' # Daily nightly builds at 2:00 AM UTC
  release:
    types: [ published, created ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Read-only look at the bundled .so files (roadmap PR 15): sizes, ELF
      # header, NEEDED chain, JNI and LibreOfficeKit exports, and whether the
      # `external fun` declarations in LibreOfficeCore.kt have a symbol. The
      # LFS checkout above is what makes the binaries inspectable at all; the
      # step never fails the job.
      - name: Native inventory (read-only)
        continue-on-error: true
        run: |
          chmod +x scripts/native-inventory.sh
          scripts/native-inventory.sh build/native-inventory.txt

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      # Test XML/HTML reports and the plan 5 dump (Plan5ElementDumpTest prints
      # to system-out) plus the native inventory, kept two weeks.
      - name: Upload test reports and native inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build/native-inventory.txt
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build (SemVer & Nightly)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive # Retrieve C++ OOXML compatibility engines & LibreOffice core if bundled
          lfs: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Kompilasi sekarang menggunakan stub java/kotlin di src/compileOnly/java
      # yang selalu disertakan dalam build.gradle.kts baik lokal maupun di GitHub Actions.
      # Dengan begitu, kita tidak perlu menginstal LibreOffice yang sangat lambat dan tidak stabil di CI.

      - name: Generate SemVer and Release Info
        id: version_calc
        run: |
          # Ambil tanggal rilis dalam format DDMMYYYY
          DATE_STR=$(date +'%d%m%Y')
          
          # Gunakan RUN_NUMBER untuk NN
          RUN_NUM="${{ github.run_number }}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.event_name }}" == "release" ]]; then
            # Jika dipicu oleh tag rilis baru atau pembuatan release manual
            TAG_NAME="${{ github.ref_name }}"
            VERSION_NAME="${TAG_NAME#v}"
            if [ -z "$VERSION_NAME" ]; then
              VERSION_NAME="1.0.0-${RUN_NUM}"
            fi
            VERSION_CODE=$((1000000 + RUN_NUM))
          else
            # Jika push biasa atau pull request, format: 1.0-nightly_DDMMYYYY_NN
            VERSION_NAME="1.0-nightly_${DATE_STR}_${RUN_NUM}"
            VERSION_CODE=$((100000 + RUN_NUM))
          fi
          
          echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Calculated Version Name: $VERSION_NAME"
          echo "Calculated Version Code: $VERSION_CODE"

      - name: Prepare nightly release notes
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: |
          DATE_UTC=$(date -u +'%Y-%m-%d %H:%M UTC')
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          cat > /tmp/nightly_body.md <<EOF
          ### Papirus Office: Nightly Build
          **Version:** \`$APP_VERSION_NAME\` · **Build #${{ github.run_number }}** · **Date:** $DATE_UTC
          Commit \`$COMMIT_SHORT\` (\`${{ github.sha }}\`) on \`${{ github.ref_name }}\` · workflow run \`${{ github.run_id }}\`

          #### Package Variants
          This build produces ABI-specific APKs. ABI labels describe the package target and do not imply that native LibreOfficeKit rendering is active; check the in-app engine status for the current build.
          * \`app-arm64-v8a-debug.apk\`: 64-bit ARM devices (modern phones and tablets)
          * \`app-armeabi-v7a-debug.apk\`: 32-bit ARM devices

          #### Feature Summary
          The bullets below describe standing project capabilities and areas of work. They are not a commit-by-commit changelog and may not represent changes introduced by this build.
          * **ODF Import:** Context-driven parser paths include style hierarchy handling for text and paragraph properties.
          * **Character Formatting:** Character-level font-size overrides and resolved style cascades are available in the Writer pipeline.
          * **Inky Word Processor:** Toolbar Hub tracks font family and size at the active caret position.
          * **Layout and Testing:** Automated tests cover selected style, pagination and hyphenation behavior; see the repository test suite for exact coverage.

          #### Installation
          Download the APK matching your device architecture (\`arm64-v8a\` for most modern devices) and install.

          _Generated: $DATE_UTC. Next automated build scheduled daily at 02:00 UTC._
          EOF
          echo "NIGHTLY_BODY_PATH=/tmp/nightly_body.md" >> $GITHUB_ENV
          cat /tmp/nightly_body.md

      - name: Purge stale nightly assets and release
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Inspecting existing nightly release..."
          if gh release view nightly >/dev/null 2>&1; then
            echo "Deleting existing assets from nightly release..."
            for asset in $(gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null); do
              echo "→ Removing old asset: $asset"
              gh release delete-asset nightly "$asset" --yes 2>/dev/null || true
            done
            echo "Deleting old nightly release and remote tag..."
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          fi
          # Prune remote tag so softprops or git creates it fresh at current commit SHA
          git push origin :refs/tags/nightly 2>/dev/null || true
          # Create and force-push fresh tag at current SHA
          git tag -f nightly ${{ github.sha }} 2>/dev/null || true
          git push origin refs/tags/nightly:refs/tags/nightly --force 2>/dev/null || true
          set -e

      - name: Decode Keystore and Google Services from Base64
        run: |
          # Mengubah teks Base64 dari Secrets kembali menjadi file biner .jks (jika secret tersedia)
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/papirus-release.jks
          fi
          # Mengubah teks Base64 dari Secrets kembali menjadi google-services.json (jika secret tersedia)
          if [ ! -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          fi

      # 1. Otomatis setelah Commit Push / Nightly: Generate APK debug per-ABI (arm64-v8a & armeabi-v7a)
      - name: Build Debug APK (Automated Push / Nightly)
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_FONTS_REST_API: ${{ secrets.GOOGLE_FONTS_REST_API }}

      # 2. Release Manual: HANYA generate app-release.apk
      - name: Build Release APK (Manual Release)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_FONTS_REST_API: ${{ secrets.GOOGLE_FONTS_REST_API }}

      # Upload HANYA APK debug per-ABI (arm64-v8a & armeabi-v7a) untuk nightly/commit push
      - name: Drop Papirus Nightly Release (Debug APK Only)
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "nightly"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          name: "Papirus Office Nightly Build ${{ env.APP_VERSION_NAME }}"
          body_path: /tmp/nightly_body.md
          fail_on_unmatched_files: false
          generate_release_notes: false
          files: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload HANYA app-release.apk untuk Release Manual
      - name: Upload Assets to Manual Release (Release APK Only)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

