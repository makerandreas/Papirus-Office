name: Papirus Office CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *' # Daily nightly builds at 2:00 AM UTC
  release:
    types: [ published, created ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          set -o pipefail
          set +e
          ./gradlew testDebugUnitTest 2>&1 | tee /tmp/gradle_test.log
          code=$?
          if [ $code -ne 0 ]; then
            set +o pipefail
            echo "::error::GRADLE_EXIT=$code"
            {
              echo "=== TAIL-60 ==="
              tail -60 /tmp/gradle_test.log
              echo "=== ERRORS ==="
              grep -n -B3 -A15 -E "^e: |error:|FAILED|What went wrong|^Caused by|Tests .* failed" /tmp/gradle_test.log | head -250
            } > /tmp/diag_test.txt
            n=0
            base64 -w0 /tmp/diag_test.txt | fold -w 1800 | while IFS= read -r chunk; do
              n=$((n + 1))
              echo "::error::DIAG-$n $chunk"
            done
            exit 1
          fi

  build:
    name: Build (SemVer & Nightly)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive # Retrieve C++ OOXML compatibility engines & LibreOffice core if bundled
          lfs: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Kompilasi sekarang menggunakan stub java/kotlin di src/compileOnly/java
      # yang selalu disertakan dalam build.gradle.kts baik lokal maupun di GitHub Actions.
      # Dengan begitu, kita tidak perlu menginstal LibreOffice yang sangat lambat dan tidak stabil di CI.

      - name: Generate SemVer and Release Info
        id: version_calc
        run: |
          # Ambil tanggal rilis dalam format DDMMYYYY
          DATE_STR=$(date +'%d%m%Y')
          
          # Gunakan RUN_NUMBER untuk NN
          RUN_NUM="${{ github.run_number }}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.event_name }}" == "release" ]]; then
            # Jika dipicu oleh tag rilis baru atau pembuatan release manual
            TAG_NAME="${{ github.ref_name }}"
            VERSION_NAME="${TAG_NAME#v}"
            if [ -z "$VERSION_NAME" ]; then
              VERSION_NAME="1.0.0-${RUN_NUM}"
            fi
            VERSION_CODE=$((1000000 + RUN_NUM))
          else
            # Jika push biasa atau pull request, format: 1.0-nightly_DDMMYYYY_NN
            VERSION_NAME="1.0-nightly_${DATE_STR}_${RUN_NUM}"
            VERSION_CODE=$((100000 + RUN_NUM))
          fi
          
          echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Calculated Version Name: $VERSION_NAME"
          echo "Calculated Version Code: $VERSION_CODE"

      - name: Prepare nightly release notes (P2-1 — timestamp body)
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: |
          DATE_UTC=$(date -u +'%Y-%m-%d %H:%M UTC')
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          cat > /tmp/nightly_body.md <<EOF
          ### Papirus Office — Nightly Build
          **Version:** \`$APP_VERSION_NAME\` · **Build #${{ github.run_number }}** · **Date:** $DATE_UTC
          Commit \`$COMMIT_SHORT\` (\`${{ github.sha }}\`) on \`${{ github.ref_name }}\` · workflow run \`${{ github.run_id }}\`

          Debug APKs for **arm64-v8a** + **armeabi-v7a** only — universal and x86_64 builds are purged (no native libs for that ABI, see \`app/build.gradle.kts\` splits).

          #### Install
          Download the APK matching your device ABI and install. Nightly auto-replaces the previous \`nightly\` tag — old universal/x86_64 assets are deleted by the purge step below.

          _Generated: $DATE_UTC — next run 02:00 UTC daily._
          EOF
          echo "NIGHTLY_BODY_PATH=/tmp/nightly_body.md" >> $GITHUB_ENV
          cat /tmp/nightly_body.md

      - name: Purge stale nightly assets (P2-1 — remove universal/x86_64)
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Inspecting existing nightly release assets..."
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null > /tmp/existing_assets.txt || true
          if [ -s /tmp/existing_assets.txt ]; then
            echo "Existing assets:"
            cat /tmp/existing_assets.txt
            while IFS= read -r asset; do
              if echo "$asset" | grep -qiE 'universal|x86_64|x86-64|x86'; then
                echo "→ Purging stale $asset (universal/x86 not in splits)"
                gh release delete-asset nightly "$asset" --yes || true
              fi
            done < /tmp/existing_assets.txt
            # Also remove previous arm APKs so upload overwrites cleanly
            while IFS= read -r asset; do
              if echo "$asset" | grep -qE 'arm64-v8a|armeabi-v7a'; then
                echo "→ Removing previous $asset for clean overwrite"
                gh release delete-asset nightly "$asset" --yes || true
              fi
            done < /tmp/existing_assets.txt
          else
            echo "No existing nightly assets (first run or tag absent)."
          fi
          set -e

      - name: Decode Keystore and Google Services from Base64
        run: |
          # Mengubah teks Base64 dari Secrets kembali menjadi file biner .jks (jika secret tersedia)
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/papirus-release.jks
          fi
          # Mengubah teks Base64 dari Secrets kembali menjadi google-services.json (jika secret tersedia)
          if [ ! -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          fi

      # 1. Otomatis setelah Commit Push / Nightly: HANYA generate app-debug.apk
      - name: Build Debug APK (Automated Push / Nightly)
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_FONTS_REST_API: ${{ secrets.GOOGLE_FONTS_REST_API }}

      # 2. Release Manual: HANYA generate app-release.apk
      - name: Build Release APK (Manual Release)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_FONTS_REST_API: ${{ secrets.GOOGLE_FONTS_REST_API }}

      # Upload HANYA app-debug.apk untuk nightly/commit push (P2-1 — body + timestamp + purge)
      - name: Drop Papirus Nightly Release (Debug APK Only)
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "nightly"
          prerelease: true
          name: "Papirus Office Nightly Build ${{ env.APP_VERSION_NAME }}"
          body_path: /tmp/nightly_body.md
          fail_on_unmatched_files: false
          generate_release_notes: false
          files: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload HANYA app-release.apk untuk Release Manual
      - name: Upload Assets to Manual Release (Release APK Only)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

