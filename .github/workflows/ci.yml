name: Papirus Office CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
  # Environment variables defined in app/build.gradle.kts
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
  GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
  GOOGLE_FONTS_REST_API: ${{ secrets.GOOGLE_FONTS_REST_API || secrets.GOOGLE_FONTS_API_KEY }}
  GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY || secrets.GOOGLE_FONTS_REST_API }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  test:
    name: Unit & Roborazzi Snapshot Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # CI report comment on the pull request
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Read-only inspection of bundled native libraries (.so)
      - name: Native inventory (read-only)
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f scripts/native-inventory.sh ]; then
            chmod +x scripts/native-inventory.sh
            scripts/native-inventory.sh build/native-inventory.txt || true
          fi

      - name: Run Unit & Roborazzi Snapshot Tests
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew testDebugUnitTest -Proborazzi.test.record=true 2>&1 | tee build/gradle-test.log

      - name: Upload Test Reports and Roborazzi Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-snapshot-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/roborazzi/
            app/src/test/screenshots/
            src/test/screenshots/
            build/native-inventory.txt
            build/gradle-test.log
          if-no-files-found: ignore
          retention-days: 14

      # Post CI report to pull request comment
      - name: Post CI report to the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -f scripts/ci-dump-comment.py ]; then
            python3 scripts/ci-dump-comment.py app/build/test-results/testDebugUnitTest build/gradle-test.log build/native-inventory.txt > build/ci-report.md || true
            if [ -s build/ci-report.md ]; then
              gh pr comment "$PR_NUMBER" --body-file build/ci-report.md || echo "could not post the CI report comment"
            fi
          fi

  lint:
    name: Lint Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run Android Lint
        run: |
          chmod +x gradlew
          ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Calculate SemVer and Version Info
        id: version_calc
        run: |
          DATE_STR=$(date +'%d%m%Y')
          RUN_NUM="${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.event_name }}" == "release" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION_NAME="${TAG_NAME#v}"
            if [ -z "$VERSION_NAME" ]; then
              VERSION_NAME="1.0.0-${RUN_NUM}"
            fi
            VERSION_CODE=$((1000000 + RUN_NUM))
          else
            VERSION_NAME="1.0-nightly_${DATE_STR}_${RUN_NUM}"
            VERSION_CODE=$((100000 + RUN_NUM))
          fi
          echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Calculated Version Name: $VERSION_NAME"
          echo "Calculated Version Code: $VERSION_CODE"

      - name: Decode Keystore and Google Services
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/papirus-release.jks
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          fi

      - name: Assemble Debug APK
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Assemble Release APK
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Built APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
